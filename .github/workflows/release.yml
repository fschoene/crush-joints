name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JUCE_VERSION: "9.0.4"
  PLUGINVAL_VERSION: "2.0.0-beta3"

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Read and check the version
        id: read
        run: |
          version=$(sed -n 's/^project(CrushJoints VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ -z "$version" ]; then
            echo "Could not read the version from CMakeLists.txt" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS (universal)
    needs: version
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Cache JUCE
        id: juce
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/JUCE
          key: juce-${{ runner.os }}-${{ env.JUCE_VERSION }}

      - name: Fetch JUCE
        if: steps.juce.outputs.cache-hit != 'true'
        run: >
          git clone --depth 1 --branch "$JUCE_VERSION"
          https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"

      - name: Configure universal build
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DJUCE_ROOT="$RUNNER_TEMP/JUCE"
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --config Release -j"$(sysctl -n hw.ncpu)" 2>&1 | tee build.log

      - name: Run offline tests
        run: |
          ./build/CrushJointsTests_artefacts/Release/CrushJointsTests
          ./build/CrushJointsProcessorTests_artefacts/Release/CrushJointsProcessorTests

      - name: Install AU
        run: |
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          cp -R build/CrushJoints_artefacts/Release/AU/CrushJoints.component \
                "$HOME/Library/Audio/Plug-Ins/Components/"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 1

      - name: auval
        run: auval -v aufx CJTS Rflo

      - name: pluginval
        run: |
          set -euo pipefail
          curl -sL -o "$RUNNER_TEMP/pluginval.zip" \
            "https://github.com/Tracktion/pluginval/releases/download/v${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          echo "d13c260110e9a1d375e9130e79d20439dcdc9f7d0cfcad74a29197dd78d84ac3  $RUNNER_TEMP/pluginval.zip" \
            | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/pluginval.zip" -d "$RUNNER_TEMP"
          xattr -dr com.apple.quarantine "$RUNNER_TEMP/pluginval.app"
          pv="$RUNNER_TEMP/pluginval.app/Contents/MacOS/pluginval"

          "$pv" validate --strictness-level 5 --timeout-ms 60000 \
            build/CrushJoints_artefacts/Release/VST3/CrushJoints.vst3
          "$pv" validate --strictness-level 5 --timeout-ms 60000 \
            build/CrushJoints_artefacts/Release/AU/CrushJoints.component
          "$pv" validate --strictness-level 10 --timeout-ms 120000 \
            build/CrushJoints_artefacts/Release/VST3/CrushJoints.vst3

      - name: Package VST3 and AU
        run: |
          mkdir -p "dist/CrushJoints"
          cp -R build/CrushJoints_artefacts/Release/VST3/CrushJoints.vst3 "dist/CrushJoints/"
          cp -R build/CrushJoints_artefacts/Release/AU/CrushJoints.component "dist/CrushJoints/"
          cp LICENSE README.md "dist/CrushJoints/"
          ditto -c -k --sequesterRsrc --keepParent "dist/CrushJoints" \
            "dist/CrushJoints-${{ needs.version.outputs.version }}-macOS-universal.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.zip

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-release-log
          path: build.log
          if-no-files-found: ignore

  windows:
    name: Windows (x64, untested on hardware)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Cache JUCE
        id: juce
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/JUCE
          key: juce-${{ runner.os }}-${{ env.JUCE_VERSION }}

      - name: Fetch JUCE
        if: steps.juce.outputs.cache-hit != 'true'
        run: >
          git clone --depth 1 --branch "$env:JUCE_VERSION"
          https://github.com/juce-framework/JUCE.git "$env:RUNNER_TEMP/JUCE"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DJUCE_ROOT="$env:RUNNER_TEMP/JUCE"

      - name: Build
        run: |
          cmake --build build --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run offline tests
        run: |
          .\build\CrushJointsTests_artefacts\Release\CrushJointsTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\CrushJointsProcessorTests_artefacts\Release\CrushJointsProcessorTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: pluginval
        run: |
          $url = "https://github.com/Tracktion/pluginval/releases/download/v$env:PLUGINVAL_VERSION/pluginval_Windows.zip"
          $zip = "$env:RUNNER_TEMP\pluginval.zip"
          curl.exe -sL -o $zip $url
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "da158e918b60430c6a5223cd99cc2e746bda604e583258c400898caf4e95c523") {
            throw "pluginval checksum mismatch: $hash"
          }
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          $pv = "$env:RUNNER_TEMP\pluginval.exe"
          $vst3 = "build\CrushJoints_artefacts\Release\VST3\CrushJoints.vst3"

          & $pv validate --strictness-level 5 --timeout-ms 60000 $vst3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $pv validate --strictness-level 10 --timeout-ms 120000 $vst3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package VST3
        run: |
          New-Item -ItemType Directory -Force -Path "dist\CrushJoints" | Out-Null
          Copy-Item -Recurse -Path "build\CrushJoints_artefacts\Release\VST3\CrushJoints.vst3" -Destination "dist\CrushJoints"
          Copy-Item LICENSE, README.md -Destination "dist\CrushJoints"
          Compress-Archive -Path "dist\CrushJoints" `
            -DestinationPath "dist\CrushJoints-$($env:VERSION)-Windows-x64-UNTESTED.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.zip

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-log
          path: build.log
          if-no-files-found: ignore

  linux:
    name: Linux (x64, untested on hardware)
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build zip xvfb xauth libxss1 \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libegl-dev libglu1-mesa-dev mesa-common-dev

      - name: Cache JUCE
        id: juce
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/JUCE
          key: juce-${{ runner.os }}-${{ env.JUCE_VERSION }}

      - name: Fetch JUCE
        if: steps.juce.outputs.cache-hit != 'true'
        run: >
          git clone --depth 1 --branch "$JUCE_VERSION"
          https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"

      - name: Configure
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DJUCE_ROOT="$RUNNER_TEMP/JUCE"

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel "$(nproc)" 2>&1 | tee build.log

      - name: Run offline tests
        run: |
          xvfb-run -a ./build/CrushJointsTests_artefacts/Release/CrushJointsTests
          xvfb-run -a ./build/CrushJointsProcessorTests_artefacts/Release/CrushJointsProcessorTests

      - name: pluginval
        run: |
          set -euo pipefail
          curl -sL -o "$RUNNER_TEMP/pluginval.zip" \
            "https://github.com/Tracktion/pluginval/releases/download/v${PLUGINVAL_VERSION}/pluginval_Linux.zip"
          echo "2e23d311c8c2664457b11be8f6cf4ed29cfdc08765c71c43934a1ed3360f118f  $RUNNER_TEMP/pluginval.zip" \
            | sha256sum -c -
          unzip -q "$RUNNER_TEMP/pluginval.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/pluginval"
          pv="$RUNNER_TEMP/pluginval"
          vst3="build/CrushJoints_artefacts/Release/VST3/CrushJoints.vst3"

          xvfb-run -a "$pv" validate --strictness-level 5 --timeout-ms 60000 "$vst3"
          xvfb-run -a "$pv" validate --strictness-level 10 --timeout-ms 120000 "$vst3"

      - name: Package VST3
        run: |
          mkdir -p dist/CrushJoints
          cp -R build/CrushJoints_artefacts/Release/VST3/CrushJoints.vst3 dist/CrushJoints/
          cp LICENSE README.md dist/CrushJoints/
          (cd dist && zip -qr "CrushJoints-${VERSION}-Linux-x64-UNTESTED.zip" CrushJoints)

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*.zip

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-release-log
          path: build.log
          if-no-files-found: ignore

  publish:
    name: Publish GitHub release
    needs: [macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          body: |
            macOS: VST3 and AU, universal (arm64 + x86_64), unsigned.

            Windows and Linux: VST3 builds that were compiled, unit-tested and
            pluginval-tested on GitHub Actions. They have **not** been tested
            on real hardware or in a DAW by the developer.
